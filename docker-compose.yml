services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbontrace
      POSTGRES_USER: carbontrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbontrace -d carbontrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:0.6.2
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://carbontrace:${POSTGRES_PASSWORD}@db:5432/carbontrace
      CELERY_BROKER_URL: redis://redis:6379/0
      RUN_JOBS_ASYNC: "true"
      CORS_ORIGINS: http://localhost:8080
      UPLOAD_DIRECTORY: /app/uploads
      REPORT_DIRECTORY: /app/generated_reports
      OWID_DATA_DIRECTORY: /app/data/owid
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/generated_reports
      - benchmark_data:/app/data/owid
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://carbontrace:${POSTGRES_PASSWORD}@db:5432/carbontrace
      CELERY_BROKER_URL: redis://redis:6379/0
      RUN_JOBS_ASYNC: "true"
      UPLOAD_DIRECTORY: /app/uploads
      REPORT_DIRECTORY: /app/generated_reports
      OWID_DATA_DIRECTORY: /app/data/owid
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/generated_reports
      - benchmark_data:/app/data/owid
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://carbontrace:${POSTGRES_PASSWORD}@db:5432/carbontrace
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIRECTORY: /app/uploads
      REPORT_DIRECTORY: /app/generated_reports
      OWID_DATA_DIRECTORY: /app/data/owid
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - benchmark_data:/app/data/owid
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  reports_data:
  benchmark_data:
  chroma_data:
